<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo Booth</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f8f2ec;
  color: #333;
  text-align: center;
}

header {
  padding: 25px 15px;
}

header h1 {
  font-family: Georgia, serif;
  font-size: 32px;
  margin-bottom: 8px;
}

header p {
  font-size: 13px;
  color: #777;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 15px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 5px 20px #00000010;
  margin-bottom: 20px;
}

button {
  border: none;
  background: #405d46;
  color: white;
  padding: 13px 22px;
  border-radius: 30px;
  font-size: 14px;
  cursor: pointer;
  margin: 5px;
}

button.secondary {
  background: #e9e2d9;
  color: #333;
}

button:disabled {
  opacity: .5;
}

video {
  width: 100%;
  border-radius: 15px;
  background: #222;
  transform: scaleX(-1);
}

.camera-wrap {
  position: relative;
}

#countdown {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 90px;
  color: white;
  font-weight: bold;
  text-shadow: 0 3px 10px black;
}

#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  border-radius: 15px;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 15px;
}

.photo-count {
  margin: 15px;
  font-size: 14px;
  color: #777;
}

.strip {
  width: 220px;
  margin: 20px auto;
  padding: 12px;
  background: white;
  box-shadow: 0 5px 20px #0002;
}

.strip img {
  width: 100%;
  display: block;
  margin-bottom: 8px;
}

.strip-footer {
  font-family: Georgia, serif;
  font-size: 13px;
  padding: 12px 0 5px;
}

.theme-options {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 15px;
}

.theme {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  border: 2px solid #aaa;
  cursor: pointer;
}

#message {
  font-size: 13px;
  color: #777;
  margin: 10px;
}

footer {
  padding: 25px;
  color: #999;
  font-size: 11px;
}
</style>
</head>

<body>

<header>
  <h1>Photo Booth</h1>
  <p>Capture your little moments ♡</p>
</header>

<div class="container">

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="card">
      <h2>Let's take some pictures!</h2>
      <p style="margin:15px 0;color:#888;font-size:14px">
        Get ready, smile and make memories.
      </p>
      <button onclick="startCamera()">START PHOTOBOOTH ♡</button>
    </div>
  </section>

  <!-- CAMERA -->
  <section id="camera" class="screen">
    <div class="card">

      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div id="countdown"></div>
        <div id="flash"></div>
      </div>

      <div class="photo-count" id="photoCount">
        PHOTO 1 OF 3
      </div>

      <p id="message">Ready for your first photo?</p>

      <div class="controls">
        <button onclick="flipCamera()" class="secondary">
          FLIP CAMERA
        </button>
        <button id="captureBtn" onclick="takePhoto()">
          TAKE PHOTO
        </button>
      </div>

    </div>
  </section>

  <!-- PREVIEW -->
  <section id="preview" class="screen">
    <div class="card">
      <h2>Your memories ♡</h2>
      <p style="color:#888;font-size:13px;margin-top:8px">
        Choose your photostrip background.
      </p>

      <div class="theme-options">
        <div class="theme" style="background:#ffffff"
          onclick="changeTheme('#ffffff')"></div>
        <div class="theme" style="background:#f5dfe5"
          onclick="changeTheme('#f5dfe5')"></div>
        <div class="theme" style="background:#dce8d8"
          onclick="changeTheme('#dce8d8')"></div>
        <div class="theme" style="background:#eee3d2"
          onclick="changeTheme('#eee3d2')"></div>
      </div>

      <div class="strip" id="strip">
        <div id="stripPhotos"></div>
        <div class="strip-footer">
          PHOTO BOOTH ♡
          <br>
          <small id="date"></small>
        </div>
      </div>

      <button onclick="downloadStrip()">DOWNLOAD PHOTO</button>
      <br>
      <button class="secondary" onclick="retake()">RETAKE</button>
      <button class="secondary" onclick="finish()">HOME</button>
    </div>
  </section>

</div>

<footer>
  MADE WITH LOVE ♡
</footer>

<script>
const video = document.getElementById("video");
const countdown = document.getElementById("countdown");
const photoCount = document.getElementById("photoCount");
const message = document.getElementById("message");
const captureBtn = document.getElementById("captureBtn");

let stream = null;
let facingMode = "user";
let photos = [];
let themeColor = "#ffffff";
let busy = false;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}

async function startCamera() {
  try {
    await openCamera();
    photos = [];
    showScreen("camera");
    updateCount();
  } catch (error) {
    alert("Unable to access camera. Please allow camera permission in Safari settings.");
  }
}

async function openCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: facingMode,
      width: { ideal: 1280 },
      height: { ideal: 1920 }
    }
  });

  video.srcObject = stream;
  await video.play();
}

async function flipCamera() {
  if (busy) return;

  facingMode = facingMode === "user" ? "environment" : "user";

  try {
    await openCamera();
  } catch (error) {
    facingMode = facingMode === "user" ? "environment" : "user";
    alert("Unable to switch camera.");
  }
}

function updateCount() {
  photoCount.textContent = `PHOTO ${photos.length + 1} OF 3`;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function takePhoto() {
  if (busy || photos.length >= 3) return;

  busy = true;
  captureBtn.disabled = true;

  for (let i = 3; i >= 1; i--) {
    countdown.style.display = "flex";
    countdown.textContent = i;
    await sleep(1000);
  }

  countdown.style.display = "none";

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  if (facingMode === "user") {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  photos.push(canvas.toDataURL("image/jpeg", 0.95));

  const flash = document.getElementById("flash");
  flash.style.opacity = "1";
  await sleep(120);
  flash.style.opacity = "0";

  busy = false;
  captureBtn.disabled = false;

  if (photos.length < 3) {
    updateCount();
    message.textContent = "Beautiful! Get ready for the next one ♡";
  } else {
    stopCamera();
    createPreview();
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

function createPreview() {
  const area = document.getElementById("stripPhotos");
  area.innerHTML = "";

  photos.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    area.appendChild(img);
  });

  document.getElementById("date").textContent =
    new Date().toLocaleDateString();

  changeTheme(themeColor);
  showScreen("preview");
}

function changeTheme(color) {
  themeColor = color;
  document.getElementById("strip").style.background = color;
}

async function downloadStrip() {
  const images = [];

  for (const src of photos) {
    const img = new Image();
    img.src = src;
    await new Promise(resolve => img.onload = resolve);
    images.push(img);
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const width = 700;
  const padding = 35;
  const photoHeight = 420;
  const gap = 20;

  canvas.width = width;
  canvas.height = padding * 2 + (photoHeight * 3) +
                  (gap * 2) + 100;

  ctx.fillStyle = themeColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = padding;

  images.forEach(img => {
    const ratio = Math.max(width / img.width,
                           photoHeight / img.height);

    const w = img.width * ratio;
    const h = img.height * ratio;

    const sx = (w - width) / 2;
    const sy = (h - photoHeight) / 2;

    ctx.drawImage(
      img,
      sx / ratio,
      sy / ratio,
      width / ratio,
      photoHeight / ratio,
      0,
      y,
      width,
      photoHeight
    );

    y += photoHeight + gap;
  });

  ctx.fillStyle = "#333";
  ctx.textAlign = "center";
  ctx.font = "32px Georgia";
  ctx.fillText("PHOTO BOOTH ♡", width / 2, y + 25);

  ctx.font = "20px Arial";
  ctx.fillText(
    new Date().toLocaleDateString(),
    width / 2,
    y + 60
  );

  const link = document.createElement("a");
  link.download = "my-photostrip.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

async function retake() {
  photos = [];
  facingMode = "user";

  try {
    await openCamera();
    showScreen("camera");
    updateCount();
    message.textContent = "Let's try again!";
  } catch (error) {
    alert("Unable to reopen camera.");
  }
}

function finish() {
  stopCamera();
  photos = [];
  showScreen("home");
}
</script>

</body>
</html></html></html>
