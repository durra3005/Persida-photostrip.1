

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#f5e1e7">

<title>Floral Photobooth | PERSIDA</title>

<style>

:root {

  --pink: #f5e1e7;

  --rose: #bd8194;

  --sage: #82977b;

  --cream: #fffaf5;

  --green: #4d6149;

}

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  min-height: 100%;

  font-family: Georgia, serif;

  background: var(--pink);

  color: var(--green);

}

body {

  min-height: 100vh;

  min-height: 100dvh;

}

main {

  position: relative;

  width: 100%;

  height: 100vh;

  height: 100dvh;

  overflow: hidden;

  background: var(--pink);

}

#camera {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  background: #e8e8df;

}

.camera-frame {

  position: absolute;

  inset: 12px;

  z-index: 2;

  border: 1.5px solid rgba(255,250,245,.9);

  border-radius: 24px;

  pointer-events: none;

}

.flower {

  position: absolute;

  z-index: 3;

  color: var(--cream);

  font-size: 24px;

  text-shadow: 0 1px 8px #0005;

  pointer-events: none;

}

.top-left {

  top: 25px;

  left: 26px;

}

.top-right {

  top: 25px;

  right: 26px;

}

.bottom-left {

  bottom: 28px;

  left: 26px;

}

.bottom-right {

  bottom: 28px;

  right: 26px;

}

.header {

  position: absolute;

  z-index: 3;

  top: max(35px, env(safe-area-inset-top));

  left: 0;

  width: 100%;

  padding: 0 45px;

  text-align: center;

  color: white;

  text-shadow: 0 1px 8px #0007;

  letter-spacing: 2px;

  font-size: 12px;

}

#countdown {

  position: absolute;

  z-index: 4;

  inset: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  color: white;

  font-family: Georgia, serif;

  font-size: clamp(90px, 24vw, 150px);

  text-shadow: 0 3px 18px #0007;

  pointer-events: none;

}

#status {

  position: absolute;

  z-index: 4;

  bottom: calc(115px + env(safe-area-inset-bottom));

  left: 20px;

  right: 20px;

  margin: 0;

  color: white;

  text-align: center;

  font-size: 14px;

  line-height: 1.5;

  text-shadow: 0 1px 8px #0008;

}

.controls {

  position: absolute;

  z-index: 5;

  bottom: calc(32px + env(safe-area-inset-bottom));

  left: 0;

  width: 100%;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

}

button, .download {

  border: 1px solid #fff9;

  border-radius: 50px;

  padding: 13px 22px;

  background: var(--sage);

  color: white;

  font: inherit;

  font-size: 14px;

  cursor: pointer;

  text-decoration: none;

  -webkit-tap-highlight-color: transparent;

}

.secondary {

  background: var(--rose);

}

button:disabled {

  opacity: .55;

  cursor: default;

}

#strip {

  display: none;

  width: min(82%, 340px);

  max-height: 70%;

  object-fit: contain;

  position: absolute;

  z-index: 6;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  border: 5px solid var(--cream);

  box-shadow: 0 8px 30px #0004;

  background: var(--cream);

}

#resultButtons {

  display: none;

  position: absolute;

  z-index: 7;

  bottom: calc(20px + env(safe-area-inset-bottom));

  left: 0;

  right: 0;

  text-align: center;

}

#download {

  display: inline-block;

  background: var(--rose);

}

#permissionMessage {

  position: absolute;

  z-index: 8;

  inset: 0;

  display: none;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 32px;

  background: var(--cream);

  text-align: center;

  line-height: 1.7;

}

#permissionMessage button {

  margin-top: 15px;

}

@media (max-height: 600px) {

  .header {

    top: 18px;

  }

  .controls {

    bottom: 15px;

  }

  #status {

    bottom: 75px;

  }

}

</style>

</head>

<body>

<main>

  <video id="camera" autoplay playsinline muted></video>

  <div class="camera-frame"></div>

  <div class="header">

    APPRECIATION NIGHT · PERSIDA

  </div>

  <div class="flower top-left">✿</div>

  <div class="flower top-right">❀</div>

  <div class="flower bottom-left">❀</div>

  <div class="flower bottom-right">✿</div>

  <div id="countdown">♡</div>

  <p id="status">Ready for your little memories?</p>

  <div class="controls" id="controls">

    <button id="start">Start ♡</button>

    <button id="flip" class="secondary">Flip ↻</button>

  </div>

  <canvas id="strip"></canvas>

  <div id="resultButtons">

    <button id="again">Retake ↻</button>

    <a id="download" class="download"

       download="PERSIDA-Photostrip.png">Save ♡</a>

  </div>

  <div id="permissionMessage">

    <div style="font-size:35px;color:#82977b">✿</div>

    <h2>Camera access needed</h2>

    <p>Please allow camera access in your browser settings, then try again.</p>

    <button id="retry">Try Again ♡</button>

  </div>

</main>

<script>

const video = document.getElementById("camera");

const countdown = document.getElementById("countdown");

const statusText = document.getElementById("status");

const startButton = document.getElementById("start");

const flipButton = document.getElementById("flip");

const strip = document.getElementById("strip");

const download = document.getElementById("download");

const resultButtons = document.getElementById("resultButtons");

const controls = document.getElementById("controls");

const permissionMessage = document.getElementById("permissionMessage");

let stream = null;

let facingMode = "user";

let busy = false;

let photos = [];

let cameraReady = false;

function wait(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

async function openCamera() {

  if (!navigator.mediaDevices ||

      !navigator.mediaDevices.getUserMedia) {

    showCameraError(

      "Camera needs HTTPS. Please open your published GitHub Pages website."

    );

    return false;

  }

  if (stream) {

    stream.getTracks().forEach(track => track.stop());

    stream = null;

  }

  cameraReady = false;

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: { ideal: facingMode },

        width: { ideal: 1080 },

        height: { ideal: 1440 }

      }

    });

    video.srcObject = stream;

    await video.play();

    if (!video.videoWidth) {

      await new Promise(resolve => {

        video.addEventListener("loadedmetadata", resolve, {

          once: true

        });

      });

    }

    cameraReady = true;

    permissionMessage.style.display = "none";

    statusText.textContent = "Camera ready ♡";

    return true;

  } catch (error) {

    showCameraError(

      "Allow camera access in your browser, then tap Try Again."

    );

    return false;

  }

}

function showCameraError(message) {

  cameraReady = false;

  permissionMessage.style.display = "flex";

  permissionMessage.querySelector("p").textContent = message;

  statusText.textContent = "Camera unavailable";

}

async function takeThreePhotos() {

  if (busy) return;

  busy = true;

  startButton.disabled = true;

  flipButton.disabled = true;

  resultButtons.style.display = "none";

  strip.style.display = "none";

  photos = [];

  try {

    if (!cameraReady || !stream || !stream.active) {

      const opened = await openCamera();

      if (!opened) return;

    }

    controls.style.display = "none";

    for (let i = 0; i < 3; i++) {

      statusText.textContent =

        `PHOTO ${i + 1} OF 3 · GET READY`;

      for (let n = 5; n >= 1; n--) {

        countdown.textContent = n;

        await wait(1000);

      }

      countdown.textContent = "SNAP!";

      await wait(200);

      const canvas = document.createElement("canvas");

      canvas.width = video.videoWidth;

      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");

      if (facingMode === "user") {

        ctx.translate(canvas.width, 0);

        ctx.scale(-1, 1);

      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      photos.push(canvas);

      // Briefly clear the number before the next countdown.

      countdown.textContent = "♡";

      await wait(650);

    }

    createStrip();

    countdown.textContent = "";

    statusText.textContent = "Your memories are ready ♡";

    resultButtons.style.display = "block";

  } catch (error) {

    statusText.textContent = "Something went wrong. Please try again.";

    controls.style.display = "flex";

  } finally {

    busy = false;

    startButton.disabled = false;

    flipButton.disabled = false;

  }

}

function createStrip() {

  const width = 600;

  const photoWidth = 500;

  const photoHeight = 500;

  const gap = 16;

  const top = 125;

  const bottom = 100;

  strip.width = width;

  strip.height = top + photoHeight * 3 + gap * 2 + bottom;

  const ctx = strip.getContext("2d");

  ctx.fillStyle = "#f5e1e7";

  ctx.fillRect(0, 0, width, strip.height);

  ctx.fillStyle = "#fffaf5";

  ctx.fillRect(16, 16, width - 32, strip.height - 32);

  ctx.textAlign = "center";

  ctx.fillStyle = "#82977b";

  ctx.font = "38px Georgia";

  ctx.fillText("✿   ❀   ✿", width / 2, 52);

  ctx.fillStyle = "#a7657b";

  ctx.font = "bold 28px Georgia";

  ctx.fillText("PERSIDA ♡", width / 2, 88);

  ctx.fillStyle = "#4d6149";

  ctx.font = "16px Georgia";

  ctx.fillText("Appreciation Night · 3.11.2026",

    width / 2, 111);

  photos.forEach((photo, i) => {

    const x = 50;

    const y = top + i * (photoHeight + gap);

    ctx.fillStyle = "#d5b5a5";

    ctx.fillRect(x - 4, y - 4, photoWidth + 8, photoHeight + 8);

    const scale = Math.max(

      photoWidth / photo.width,

      photoHeight / photo.height

    );

    const sw = photoWidth / scale;

    const sh = photoHeight / scale;

    const sx = (photo.width - sw) / 2;

    const sy = (photo.height - sh) / 2;

    ctx.drawImage(

      photo,

      sx, sy, sw, sh,

      x, y, photoWidth, photoHeight

    );

    ctx.font = "24px Georgia";

    ctx.fillStyle = "#fffaf5";

    ctx.fillText("✿", x + 20, y + 30);

    ctx.fillText("❀", x + photoWidth - 20, y + photoHeight - 10);

  });

  ctx.fillStyle = "#82977b";

  ctx.font = "22px Georgia";

  ctx.fillText("♡ Made with love ♡",

    width / 2, strip.height - 38);

  strip.style.display = "block";

  download.href = strip.toDataURL("image/png");

}

startButton.addEventListener("click", takeThreePhotos);

flipButton.addEventListener("click", async () => {

  if (busy) return;

  facingMode = facingMode === "user" ? "environment" : "user";

  const opened = await openCamera();

  if (opened) {

    statusText.textContent =

      facingMode === "user" ? "Front camera ♡" : "Back camera ♡";

  }

});

document.getElementById("again").addEventListener("click", () => {

  takeThreePhotos();

});

document.getElementById("retry").addEventListener("click", async () => {

  const opened = await openCamera();

  if (opened) {

    controls.style.display = "flex";

  }

});

// Open camera only after permission can be requested.

// If permission is blocked, show a helpful retry message.

openCamera().then(opened => {

  if (!opened) {

    controls.style.display = "none";

  }

});

</script>

</body>

</html></html>
