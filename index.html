<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">
  <?!= include("Styles"); ?>
</head>

<body>

<section class="screen">

  <h1>PERSIDA 12</h1>

  <h2>Your Memories ♡</h2>

  <p id="status">Loading your photos...</p>

  <div id="gallery"></div>

</section>

<script>
const TOKEN = <?!= JSON.stringify(token) ?>;

google.script.run
  .withSuccessHandler(showFiles)
  .withFailureHandler(error => {
    document.getElementById("status").textContent =
      error.message;
  })
  .getGuestFiles(TOKEN);

function showFiles(data) {
  const gallery = document.getElementById("gallery");

  document.getElementById("status").textContent =
    "Your personal Persida 12 photos are ready!";

  data.photos.forEach((photo, index) => {
    const card = document.createElement("div");
    card.className = "photo-template";

    const img = document.createElement("img");
    img.src = photo.preview;
    img.alt = "Photo " + (index + 1);

    const link = document.createElement("a");
    link.href = photo.download;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "DOWNLOAD PHOTO " + (index + 1);

    card.appendChild(img);
    card.appendChild(link);

    gallery.appendChild(card);
  });

  const videoLink = document.createElement("a");
  videoLink.href = data.video.download;
  videoLink.target = "_blank";
  videoLink.rel = "noopener";
  videoLink.textContent = "DOWNLOAD YOUR VIDEO";

  gallery.appendChild(videoLink);
}
</script>

</body>
